name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-api.txt
            requirements-transformers.txt
            requirements-dev.txt

      - name: Install CPU PyTorch
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.4"

      - name: Install project and test dependencies
        run: python -m pip install -r requirements-dev.txt -r requirements-transformers.txt

      - name: Run tests
        run: python -m pytest -p no:cacheprovider
